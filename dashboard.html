        // 2. Initializing & Routing Logic
        function initDashboard() {
            // Determine Role from URL search param or fallback to 'upazilla'
            const urlParams = new URLSearchParams(window.location.search);
            let userRole = urlParams.get('role') || localStorage.getItem('userRole') || 'upazilla';

            if (!roleDashboards[userRole]) {
                userRole = 'upazilla'; // Default fallback
            }

            const currentData = roleDashboards[userRole];

            // Render Header Profile Info
            document.getElementById('profileName').innerText = currentData.userName;
            document.getElementById('profileRole').innerText = currentData.roleTitle;

            // Render Sidebar
            const sidebar = document.getElementById('sidebarMenu');
            sidebar.innerHTML = '';
            currentData.menu.forEach((item, idx) => {
                const navItem = document.createElement('a');
                navItem.href = "#";
                navItem.className = `flex items-center px-4 py-3 text-sm font-medium rounded-xl transition duration-150 ${
                    idx === 0 
                    ? 'bg-emerald-800 text-white font-semibold shadow-sm' 
                    : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                }`;
                navItem.innerHTML = `<i class="fa-solid fa-chevron-right text-[10px] mr-2.5 ${idx === 0 ? 'text-emerald-300' : 'text-slate-400'}"></i> ${item}`;
                sidebar.appendChild(navItem);
            });

            // Render Dashboard Main Content
            const contentArea = document.getElementById('dashboardContent');
            contentArea.innerHTML = `
                <!-- Welcome Banner -->
                <div class="bg-gradient-to-r from-emerald-800 to-teal-900 rounded-2xl p-6 text-white shadow-sm flex justify-between items-center">
                    <div>
                        <span class="bg-emerald-700/60 text-emerald-200 text-xs font-semibold px-3 py-1 rounded-full border border-emerald-500/30">
                            ${currentData.roleTitle}
                        </span>
                        <h2 class="text-2xl font-bold mt-2">${currentData.roleTitle} - ড্যাশবোর্ড</h2>
                        <p class="text-xs text-emerald-100/80 mt-1">প্রাণিসম্পদ অধিদপ্তর ডিজিটাল নেটওয়ার্ক অ্যাক্টিভ সেশন</p>
                    </div>
                    <div class="hidden sm:block">
                        <button class="bg-white text-emerald-900 text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-emerald-50 transition shadow-sm">
                            <i class="fa-solid fa-plus mr-1"></i> নতুন ডেটা যুক্ত করুন
                        </button>
                    </div>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                    ${currentData.stats.map(s => `
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">${s.title}</p>
                                <p class="text-2xl font-extrabold ${s.color} mt-1">${s.value}</p>
                                <p class="text-xs text-slate-500 mt-1">${s.desc}</p>
                            </div>
                            <div class="w-12 h-12 rounded-xl bg-slate-50 flex items-center justify-center border border-slate-100">
                                <i class="fa-solid ${s.icon} ${s.color} text-xl"></i>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <!-- Dynamic Data Table -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                        <h3 class="font-bold text-slate-800 text-sm flex items-center">
                            <i class="fa-solid fa-list-check text-emerald-700 mr-2"></i> ${currentData.tableTitle}
                        </h3>
                        <span class="text-xs text-slate-500">আপডেট: আজ ০৭:০০ AM</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-[11px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100">
                                    <th class="py-3 px-6">ট্র্যাকিং আইডি</th>
                                    <th class="py-3 px-6">বিবরণ / আইটেম</th>
                                    <th class="py-3 px-6">পরিমাণ/বাজেট</th>
                                    <th class="py-3 px-6">অবস্থা (Status)</th>
                                    <th class="py-3 px-6">তারিখ</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-xs">
                                ${currentData.tableData.map(row => `
                                    <tr class="hover:bg-slate-50/80 transition duration-100">
                                        <td class="py-3.5 px-6 font-semibold text-slate-700">${row.id}</td>
                                        <td class="py-3.5 px-6 font-medium text-slate-900">${row.type}</td>
                                        <td class="py-3.5 px-6 text-slate-600">${row.qty}</td>
                                        <td class="py-3.5 px-6">
                                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                                row.status.includes('Approved') || row.status.includes('Optimal') || row.status.includes('Stock')
                                                ? 'bg-emerald-100 text-emerald-800 border border-emerald-200'
                                                : 'bg-amber-100 text-amber-800 border border-amber-200'
                                            }">
                                                ${row.status}
                                            </span>
                                        </td>
                                        <td class="py-3.5 px-6 text-slate-400">${row.date}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function handleLogout() {
            localStorage.removeItem('userRole');
            alert('লগআউট সম্পন্ন হয়েছে।');
            window.location.href = 'dashboard.html?role=upazilla';
        }

        // Run initialization on page load
        window.onload = initDashboard;
    </script>
</body>
</html>
